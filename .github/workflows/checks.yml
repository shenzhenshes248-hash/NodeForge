name: Checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checks:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Test dependencies
        run: sudo apt-get update && sudo apt-get install -y shellcheck jq openssl python3 curl unzip
      - name: Isolated tests (no systemd changes)
        run: bash tests/run.sh
      - name: Official Xray CLI integration (no service installation)
        run: bash tests/integration/xray.sh
